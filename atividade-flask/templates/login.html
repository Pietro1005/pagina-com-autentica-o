<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}

    <form method="POST">
        <label>Usuário:</label>
        <input type="text" name="usuario" required>
        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha" required>
        <br><br>

        <button type="submit">Entrar</button>
    </form>

    <br>
    <a href="/">Voltar</a>
</body>
</html>
